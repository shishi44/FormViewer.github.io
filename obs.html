<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>FormViewer OBS Overlay</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/obs.css">
  <link id="template-stylesheet" rel="stylesheet" href="./templates/clean/clean.css">
</head>
<body class="obs-page">
  <main id="obs-stage" class="obs-stage" aria-live="polite">
    <div id="obs-preview" class="template-host" hidden>
      <article class="template-root" data-template="clean">
        <header class="template-name-wrap"><p class="template-label" aria-hidden="true">MESSAGE FROM</p><h1 class="response-name"></h1></header>
        <div class="template-divider" aria-hidden="true"></div>
        <div class="response-content" tabindex="-1"></div>
      </article>
    </div>
    <div id="obs-debug" class="obs-debug" hidden></div>
  </main>
  <script type="module" src="./js/obs.js"></script>
</body>
</html>
